[workspace]
resolver = "3"
members = ["crates/dsp", "crates/worklet", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = 3
lto = "thin"

# The worklet wasm is small and hot; keep it fast.
[profile.worklet]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
